<div class="login-page">
  <div class="admin-card login-card">
    <img class="login-logo" src="assets/Josh-logo_f.png" alt="Josh">
    <h1 class="page-title text-center">Admin Sign in</h1>
    <p class="page-subtitle text-center mb-4">Manage cities and employee datasheets</p>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <label for="inputEmail" class="form-label">Email address</label>
      <input type="email" formControlName="email" id="inputEmail" class="form-control admin-input"
        placeholder="name@example.com" autocomplete="username">

      <label for="inputPassword" class="form-label mt-3">Password</label>
      <input type="password" formControlName="password" id="inputPassword" class="form-control admin-input"
        placeholder="Password" autocomplete="current-password">

      <button type="submit" class="btn btn-primary w-100 mt-4 py-2 login-btn" [disabled]="loginForm.invalid">
        Sign in
      </button>
    </form>
  </div>
</div>
