<form (ngSubmit)="verify()" class="otp-form">
  <p class="otp-hint">Enter the 4-digit OTP sent to <b>{{ config.data?.MobileNo }}</b></p>
  <input type="number" inputmode="numeric" [(ngModel)]="otp" name="otp" class="form-control admin-input otp-input"
    placeholder="OTP" autocomplete="one-time-code" autofocus>
  <button type="submit" class="btn btn-primary w-100 mt-3 py-2 verify-btn" [disabled]="!otp">Verify</button>
</form>
